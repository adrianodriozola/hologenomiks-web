<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Source Sans 3, Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t"><title id="t">Producción de ácido linoleico conjugado por bacterias intestinales</title><rect width="640" height="400" fill="#F4F2EC"/><rect width="640" height="54" fill="#213A52"/><text x="24" y="35" fill="#fff" font-size="20" font-weight="700">CLA bacteriano y cáncer colorrectal</text><defs><marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#213A52"/></marker></defs><rect x="24" y="110" width="160" height="80" rx="8" fill="#E9EDF1" stroke="#213A52"/><text x="104.0" y="145.0" font-size="14" font-weight="700" fill="#213A52" text-anchor="middle">Ácido linoleico</text><text x="104.0" y="165.0" font-size="12" font-weight="400" fill="#213A52" text-anchor="middle">de la dieta</text><path d="M190 150 H250" stroke="#213A52" stroke-width="3" marker-end="url(#f)"/><g fill="#2E7D71"><rect x="262" y="100" width="44" height="20" rx="10"/><rect x="318" y="126" width="44" height="20" rx="10"/><rect x="270" y="152" width="44" height="20" rx="10"/><rect x="326" y="178" width="44" height="20" rx="10"/></g><text x="316" y="226" font-size="13" font-weight="400" fill="#213A52" text-anchor="middle">Bacterias productoras</text><text x="316" y="244" font-size="13" font-weight="400" fill="#213A52" text-anchor="middle" font-style="italic">(p. ej. Bifidobacterium, Roseburia)</text><path d="M382 150 H442" stroke="#213A52" stroke-width="3" marker-end="url(#f)"/><rect x="452" y="110" width="164" height="80" rx="8" fill="#213A52" stroke="#213A52"/><text x="534.0" y="145.0" font-size="14" font-weight="700" fill="#F4F2EC" text-anchor="middle">CLA endógeno</text><text x="534.0" y="165.0" font-size="12" font-weight="400" fill="#fff" text-anchor="middle">en el colon</text><text x="24" y="300" font-size="13" font-weight="400" fill="#213A52" text-anchor="start">Revisión: el CLA producido por bacterias intestinales actúa en modelos sobre vías de</text><text x="24" y="320" font-size="13" font-weight="400" fill="#213A52" text-anchor="start">inflamación, proliferación y apoptosis. Se propone favorecer su producción endógena</text><text x="24" y="340" font-size="13" font-weight="400" fill="#213A52" text-anchor="start">con nutrición de precisión basada en microbioma. No es un tratamiento.</text><text x="616" y="390" text-anchor="end" fill="#5F6E78" font-size="12">Esquema propio, ilustrativo · Hologenomiks</text></svg>
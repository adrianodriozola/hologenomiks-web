<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Source Sans 3, Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t"><title id="t">Ultraprocesados, barrera intestinal y molestias digestivas en resistencia</title><rect width="640" height="400" fill="#F4F2EC"/><rect width="640" height="54" fill="#213A52"/><text x="24" y="35" fill="#fff" font-size="20" font-weight="700">Ultraprocesados y salud intestinal en deportistas</text><defs><marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#213A52"/></marker></defs><rect x="24" y="100" width="170" height="90" rx="8" fill="#E9EDF1" stroke="#213A52"/><text x="109.0" y="130.0" font-size="14" font-weight="700" fill="#213A52" text-anchor="middle">Suplementos y</text><text x="109.0" y="150.0" font-size="14" font-weight="700" fill="#213A52" text-anchor="middle">ultraprocesados</text><text x="109.0" y="170.0" font-size="12" font-weight="400" fill="#213A52" text-anchor="middle">aditivos, edulcorantes</text><path d="M200 145 H246" stroke="#213A52" stroke-width="3" marker-end="url(#f)"/><rect x="256" y="100" width="150" height="90" rx="8" fill="#fff" stroke="#213A52"/><rect x="268" y="132" width="22" height="40" fill="#213A52"/><rect x="296" y="132" width="22" height="40" fill="#213A52"/><rect x="324" y="132" width="22" height="40" fill="#213A52"/><rect x="352" y="132" width="22" height="40" fill="#213A52"/><rect x="380" y="132" width="22" height="40" fill="#213A52"/><text x="331" y="122" font-size="12" font-weight="400" fill="#213A52" text-anchor="middle">Barrera intestinal</text><path d="M412 145 H458" stroke="#213A52" stroke-width="3" marker-end="url(#f)"/><rect x="468" y="100" width="148" height="90" rx="8" fill="#213A52" stroke="#213A52"/><text x="542.0" y="140.0" font-size="14" font-weight="700" fill="#F4F2EC" text-anchor="middle">Disbiosis y</text><text x="542.0" y="160.0" font-size="14" font-weight="700" fill="#F4F2EC" text-anchor="middle">permeabilidad</text><text x="24" y="250" font-size="13" font-weight="400" fill="#213A52" text-anchor="start">Revisión narrativa: plantea que parte de las molestias digestivas en pruebas de</text><text x="24" y="270" font-size="13" font-weight="400" fill="#213A52" text-anchor="start">resistencia podría relacionarse con un consumo elevado de ultraprocesados y propone</text><text x="24" y="290" font-size="13" font-weight="400" fill="#213A52" text-anchor="start">ajustar la estrategia nutricional según la funcionalidad intestinal de cada deportista.</text><text x="24" y="322" font-size="13" font-weight="400" fill="#5F6E78" text-anchor="start">Hipótesis que requiere estudios de intervención.</text><text x="616" y="390" text-anchor="end" fill="#5F6E78" font-size="12">Esquema propio, ilustrativo · Hologenomiks</text></svg>
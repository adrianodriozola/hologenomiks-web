<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 522" font-family="'Source Sans 3', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t"><title id="t">Microbiota de mucosa tumoral frente a mucosa adyacente no tumoral</title><rect width="360" height="522" fill="#F4F2EC"/><defs><marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#213A52"/></marker></defs><rect width="360" height="70" fill="#213A52"/><text x="16" y="35" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="start">Microbiota de mucosa en</text><text x="16" y="59" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="start">cáncer colorrectal</text><text x="16" y="104" font-size="16" font-weight="700" fill="#213A52" text-anchor="start">130 tejidos pareados (tumor y</text><text x="16" y="125" font-size="16" font-weight="700" fill="#213A52" text-anchor="start">mucosa adyacente) · 16S V3–V4 ·</text><text x="16" y="146" font-size="16" font-weight="700" fill="#213A52" text-anchor="start">MinION</text><rect x="16" y="158" width="156" height="150" rx="12" fill="#EAF4F1" stroke="#2E7D71"/><rect x="188" y="158" width="156" height="150" rx="12" fill="#FFFFFF" stroke="#213A52" stroke-width="2"/><text x="94.0" y="180" font-size="16" font-weight="700" fill="#213A52" text-anchor="middle">Mucosa</text><text x="94.0" y="201" font-size="16" font-weight="700" fill="#213A52" text-anchor="middle">adyacente</text><text x="266.0" y="180" font-size="16" font-weight="700" fill="#213A52" text-anchor="middle">Tejido tumoral</text><g fill="#2E7D71"><circle cx="52" cy="238" r="9"/><circle cx="86" cy="263" r="9"/><circle cx="126" cy="236" r="9"/><circle cx="140" cy="280" r="9"/><circle cx="66" cy="288" r="9"/></g><g fill="#5C7189"><rect x="208" y="232" width="30" height="9" rx="4"/><rect x="258" y="250" width="30" height="9" rx="4"/><rect x="292" y="228" width="30" height="9" rx="4"/><rect x="222" y="276" width="30" height="9" rx="4"/><rect x="284" y="284" width="30" height="9" rx="4"/></g><text x="16" y="344" font-size="16" font-weight="400" fill="#213A52" text-anchor="start">Más abundantes en tumor:</text><text x="16" y="365" font-size="16" font-weight="400" fill="#213A52" text-anchor="start">Fusobacterium, Leptotrichia,</text><text x="16" y="386" font-size="16" font-weight="400" fill="#213A52" text-anchor="start">Streptococcus</text><text x="16" y="412" font-size="16" font-weight="400" fill="#213A52" text-anchor="start">Menos abundantes en tumor:</text><text x="16" y="433" font-size="16" font-weight="400" fill="#213A52" text-anchor="start">Bacteroides, Corynebacterium</text><text x="16" y="462" font-size="15" font-weight="400" fill="#5F6E78" text-anchor="start">Asociaciones observacionales: por sí</text><text x="16" y="482" font-size="15" font-weight="400" fill="#5F6E78" text-anchor="start">solas no establecen causalidad.</text><text x="344" y="510" font-size="13" font-weight="400" fill="#5F6E78" text-anchor="end">Esquema propio, ilustrativo · Hologenomiks</text></svg>
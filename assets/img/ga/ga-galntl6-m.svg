<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 513" font-family="'Source Sans 3', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t"><title id="t">Polimorfismo GALNTL6 rs558129 y potencia anaeróbica</title><rect width="360" height="513" fill="#F4F2EC"/><defs><marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#213A52"/></marker></defs><rect width="360" height="70" fill="#213A52"/><text x="16" y="35" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="start">Genética y potencia: GALNTL6</text><text x="16" y="59" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="start">rs558129</text><text x="16" y="104" font-size="16" font-weight="700" fill="#213A52" text-anchor="start">Test de Wingate (85 personas</text><text x="16" y="125" font-size="16" font-weight="700" fill="#213A52" text-anchor="start">activas, España) y frecuencias</text><text x="16" y="146" font-size="16" font-weight="700" fill="#213A52" text-anchor="start">alélicas en deportistas (Rusia)</text><text x="16" y="175" font-size="17" font-weight="700" fill="#213A52" text-anchor="start">Portadores del alelo T: potencia</text><text x="16" y="197" font-size="17" font-weight="700" fill="#213A52" text-anchor="start">≈ 5–7 % mayor</text><line x1="16" y1="363" x2="344" y2="363" stroke="#5F6E78"/><rect x="50" y="243" width="100" height="120" fill="#5F6E78"/><rect x="210" y="227" width="100" height="136" fill="#213A52"/><text x="100" y="382" font-size="15" font-weight="400" fill="#213A52" text-anchor="middle">Genotipo CC</text><text x="260" y="382" font-size="15" font-weight="400" fill="#213A52" text-anchor="middle">Portadores del</text><text x="260" y="402" font-size="15" font-weight="400" fill="#213A52" text-anchor="middle">alelo T</text><text x="16" y="433" font-size="15" font-weight="400" fill="#5F6E78" text-anchor="start">Efecto pequeño de una sola variante: el</text><text x="16" y="453" font-size="15" font-weight="400" fill="#5F6E78" text-anchor="start">rendimiento es poligénico y depende del</text><text x="16" y="473" font-size="15" font-weight="400" fill="#5F6E78" text-anchor="start">entrenamiento.</text><text x="344" y="501" font-size="13" font-weight="400" fill="#5F6E78" text-anchor="end">Esquema propio, ilustrativo · Hologenomiks</text></svg>
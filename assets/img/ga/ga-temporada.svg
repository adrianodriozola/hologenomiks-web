<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Source Sans 3, Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t"><title id="t">Evolución de la microbiota de un corredor de montaña durante una temporada</title><rect width="640" height="400" fill="#F4F2EC"/><rect width="640" height="54" fill="#213A52"/><text x="24" y="35" fill="#fff" font-size="20" font-weight="700">Microbiota durante una temporada competitiva</text><defs><marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#213A52"/></marker></defs><line x1="60" y1="310" x2="600" y2="310" stroke="#5F6E78"/><line x1="60" y1="96" x2="60" y2="310" stroke="#5F6E78"/><text x="34" y="205" transform="rotate(-90 34 205)" text-anchor="middle" font-size="13" fill="#213A52">Diversidad (esquema)</text><polyline points="100,270 190,250 280,236 370,214 460,182 550,152" fill="none" stroke="#2E7D71" stroke-width="4"/><circle cx="100" cy="270" r="8" fill="#F4F2EC" stroke="#2E7D71" stroke-width="3"/><text x="100" y="330" font-size="12" font-weight="400" fill="#213A52" text-anchor="middle">M1</text><circle cx="190" cy="250" r="8" fill="#F4F2EC" stroke="#2E7D71" stroke-width="3"/><text x="190" y="330" font-size="12" font-weight="400" fill="#213A52" text-anchor="middle">M2</text><circle cx="280" cy="236" r="8" fill="#F4F2EC" stroke="#2E7D71" stroke-width="3"/><text x="280" y="330" font-size="12" font-weight="400" fill="#213A52" text-anchor="middle">M3</text><circle cx="370" cy="214" r="8" fill="#F4F2EC" stroke="#2E7D71" stroke-width="3"/><text x="370" y="330" font-size="12" font-weight="400" fill="#213A52" text-anchor="middle">M4</text><circle cx="460" cy="182" r="8" fill="#F4F2EC" stroke="#2E7D71" stroke-width="3"/><text x="460" y="330" font-size="12" font-weight="400" fill="#213A52" text-anchor="middle">M5</text><circle cx="550" cy="152" r="8" fill="#F4F2EC" stroke="#2E7D71" stroke-width="3"/><text x="550" y="330" font-size="12" font-weight="400" fill="#213A52" text-anchor="middle">M6</text><text x="80" y="100" font-size="13" font-weight="400" fill="#213A52" text-anchor="start">Carreras de 42 y de 172 km se asociaron a cambios distintos en la microbiota.</text><text x="330" y="360" font-size="13" font-weight="400" fill="#5F6E78" text-anchor="middle">5 meses · 6 muestras · un único deportista (estudio de caso)</text><text x="616" y="390" text-anchor="end" fill="#5F6E78" font-size="12">Esquema propio, ilustrativo · Hologenomiks</text></svg>
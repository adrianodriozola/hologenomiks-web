<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Source Sans 3, Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t"><title id="t">Microbiota de mucosa tumoral frente a mucosa adyacente no tumoral</title><rect width="640" height="400" fill="#F4F2EC"/><rect width="640" height="54" fill="#213A52"/><text x="24" y="35" fill="#fff" font-size="20" font-weight="700">Microbiota de mucosa en cáncer colorrectal</text><defs><marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#213A52"/></marker></defs><text x="24" y="90" font-size="14" font-weight="700" fill="#213A52" text-anchor="start">130 tejidos pareados (tumor y mucosa adyacente) · 16S V3–V4 · MinION</text><rect x="60" y="112" width="230" height="150" rx="12" fill="#EAF4F1" stroke="#2E7D71"/><text x="175" y="138" font-size="14" font-weight="700" fill="#213A52" text-anchor="middle">Mucosa adyacente</text><rect x="350" y="112" width="230" height="150" rx="12" fill="#fff" stroke="#213A52" stroke-width="2"/><text x="465" y="138" font-size="14" font-weight="700" fill="#213A52" text-anchor="middle">Tejido tumoral</text><g fill="#2E7D71"><circle cx="110" cy="182" r="9"/><circle cx="150" cy="207" r="9"/><circle cx="200" cy="177" r="9"/><circle cx="240" cy="217" r="9"/><circle cx="130" cy="237" r="9"/></g><g fill="#5C7189"><rect x="395" y="172" width="30" height="9" rx="4"/><rect x="440" y="192" width="30" height="9" rx="4"/><rect x="490" y="172" width="30" height="9" rx="4"/><rect x="410" y="222" width="30" height="9" rx="4"/><rect x="500" y="227" width="30" height="9" rx="4"/></g><text x="24" y="300" font-size="13" font-weight="400" fill="#213A52" text-anchor="start">Más abundantes en tumor: Fusobacterium, Leptotrichia, Streptococcus</text><text x="24" y="322" font-size="13" font-weight="400" fill="#213A52" text-anchor="start">Menos abundantes en tumor: Bacteroides, Corynebacterium</text><text x="24" y="350" font-size="13" font-weight="400" fill="#5F6E78" text-anchor="start">Asociaciones observacionales: por sí solas no establecen causalidad.</text><text x="616" y="390" text-anchor="end" fill="#5F6E78" font-size="12">Esquema propio, ilustrativo · Hologenomiks</text></svg>
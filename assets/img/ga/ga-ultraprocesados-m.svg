<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 614" font-family="'Source Sans 3', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t"><title id="t">Ultraprocesados, barrera intestinal y molestias digestivas en resistencia</title><rect width="360" height="614" fill="#F4F2EC"/><defs><marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#213A52"/></marker></defs><rect width="360" height="70" fill="#213A52"/><text x="16" y="35" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="start">Ultraprocesados y salud</text><text x="16" y="59" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="start">intestinal en deportistas</text><rect x="16" y="88" width="328" height="64" rx="8" fill="#E9EDF1" stroke="#213A52"/><text x="180.0" y="119" font-size="17" font-weight="700" fill="#213A52" text-anchor="middle">Suplementos y ultraprocesados</text><text x="180.0" y="139" font-size="14" font-weight="400" fill="#213A52" text-anchor="middle">aditivos, edulcorantes</text><path d="M180.0 156 V178" stroke="#213A52" stroke-width="3" marker-end="url(#f)"/><rect x="16" y="186" width="328" height="84" rx="8" fill="#FFFFFF" stroke="#213A52"/><text x="180.0" y="210" font-size="15" font-weight="400" fill="#213A52" text-anchor="middle">Barrera intestinal</text><rect x="38" y="222" width="24" height="36" fill="#213A52"/><rect x="70" y="222" width="24" height="36" fill="#213A52"/><rect x="102" y="222" width="24" height="36" fill="#213A52"/><rect x="134" y="222" width="24" height="36" fill="#213A52"/><rect x="166" y="222" width="24" height="36" fill="#213A52"/><rect x="198" y="222" width="24" height="36" fill="#213A52"/><rect x="230" y="222" width="24" height="36" fill="#213A52"/><rect x="262" y="222" width="24" height="36" fill="#213A52"/><rect x="294" y="222" width="24" height="36" fill="#213A52"/><path d="M180.0 274 V296" stroke="#213A52" stroke-width="3" marker-end="url(#f)"/><rect x="16" y="304" width="328" height="42" rx="8" fill="#213A52" stroke="#213A52"/><text x="180.0" y="335" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">Disbiosis y permeabilidad</text><text x="16" y="382" font-size="16" font-weight="400" fill="#213A52" text-anchor="start">Revisión narrativa: plantea que parte</text><text x="16" y="403" font-size="16" font-weight="400" fill="#213A52" text-anchor="start">de las molestias digestivas en</text><text x="16" y="424" font-size="16" font-weight="400" fill="#213A52" text-anchor="start">pruebas de resistencia podría</text><text x="16" y="445" font-size="16" font-weight="400" fill="#213A52" text-anchor="start">relacionarse con un consumo elevado</text><text x="16" y="466" font-size="16" font-weight="400" fill="#213A52" text-anchor="start">de ultraprocesados y propone ajustar</text><text x="16" y="487" font-size="16" font-weight="400" fill="#213A52" text-anchor="start">la estrategia nutricional según la</text><text x="16" y="508" font-size="16" font-weight="400" fill="#213A52" text-anchor="start">funcionalidad intestinal de cada</text><text x="16" y="529" font-size="16" font-weight="400" fill="#213A52" text-anchor="start">deportista.</text><text x="16" y="554" font-size="15" font-weight="400" fill="#5F6E78" text-anchor="start">Hipótesis que requiere estudios de</text><text x="16" y="574" font-size="15" font-weight="400" fill="#5F6E78" text-anchor="start">intervención.</text><text x="344" y="602" font-size="13" font-weight="400" fill="#5F6E78" text-anchor="end">Esquema propio, ilustrativo · Hologenomiks</text></svg>
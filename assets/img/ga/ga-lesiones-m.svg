<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 627" font-family="'Source Sans 3', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t"><title id="t">Permeabilidad intestinal, inflamación de bajo grado y lesiones musculoesqueléticas</title><rect width="360" height="627" fill="#F4F2EC"/><defs><marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#213A52"/></marker></defs><rect width="360" height="70" fill="#213A52"/><text x="16" y="35" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="start">Intestino y lesiones</text><text x="16" y="59" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="start">musculoesqueléticas</text><rect x="16" y="88" width="328" height="42" rx="8" fill="#E9EDF1" stroke="#213A52"/><text x="180.0" y="119" font-size="17" font-weight="700" fill="#213A52" text-anchor="middle">Disbiosis</text><path d="M180.0 134 V156" stroke="#213A52" stroke-width="3" marker-end="url(#f)"/><rect x="16" y="164" width="328" height="42" rx="8" fill="#E9EDF1" stroke="#213A52"/><text x="180.0" y="195" font-size="17" font-weight="700" fill="#213A52" text-anchor="middle">Permeabilidad aumentada</text><path d="M180.0 210 V232" stroke="#213A52" stroke-width="3" marker-end="url(#f)"/><rect x="16" y="240" width="328" height="64" rx="8" fill="#E9EDF1" stroke="#213A52"/><text x="180.0" y="271" font-size="17" font-weight="700" fill="#213A52" text-anchor="middle">Endotoxemia e inflamación de</text><text x="180.0" y="293" font-size="17" font-weight="700" fill="#213A52" text-anchor="middle">bajo grado</text><path d="M180.0 308 V330" stroke="#213A52" stroke-width="3" marker-end="url(#f)"/><rect x="16" y="338" width="328" height="64" rx="8" fill="#213A52" stroke="#213A52"/><text x="180.0" y="369" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">¿Recuperación más lenta de</text><text x="180.0" y="391" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">lesiones?</text><text x="16" y="438" font-size="16" font-weight="400" fill="#213A52" text-anchor="start">Revisión: examina la relación</text><text x="16" y="459" font-size="16" font-weight="400" fill="#213A52" text-anchor="start">indirecta entre la salud intestinal y</text><text x="16" y="480" font-size="16" font-weight="400" fill="#213A52" text-anchor="start">la inflamación local; la dieta y los</text><text x="16" y="501" font-size="16" font-weight="400" fill="#213A52" text-anchor="start">pre y probióticos se discuten como</text><text x="16" y="522" font-size="16" font-weight="400" fill="#213A52" text-anchor="start">posibles moduladores.</text><text x="16" y="547" font-size="15" font-weight="400" fill="#5F6E78" text-anchor="start">Relación hipotética con evidencia</text><text x="16" y="567" font-size="15" font-weight="400" fill="#5F6E78" text-anchor="start">emergente, no una causalidad</text><text x="16" y="587" font-size="15" font-weight="400" fill="#5F6E78" text-anchor="start">demostrada.</text><text x="344" y="615" font-size="13" font-weight="400" fill="#5F6E78" text-anchor="end">Esquema propio, ilustrativo · Hologenomiks</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 480" font-family="'Source Sans 3', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t"><title id="t">Mukosa tumoralaren eta ondoko mukosa ez-tumoralaren mikrobiota</title><rect width="360" height="480" fill="#F4F2EC"/><defs><marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#213A52"/></marker></defs><rect width="360" height="70" fill="#213A52"/><text x="16" y="35" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="start">Mukosako mikrobiota koloneko</text><text x="16" y="59" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="start">eta ondesteko minbizian</text><text x="16" y="104" font-size="16" font-weight="700" fill="#213A52" text-anchor="start">130 ehun parekatu: tumorea eta</text><text x="16" y="125" font-size="16" font-weight="700" fill="#213A52" text-anchor="start">ondoko mukosa · 16S V3–V4 · MinION</text><rect x="16" y="137" width="156" height="150" rx="12" fill="#EAF4F1" stroke="#2E7D71"/><rect x="188" y="137" width="156" height="150" rx="12" fill="#FFFFFF" stroke="#213A52" stroke-width="2"/><text x="94.0" y="159" font-size="16" font-weight="700" fill="#213A52" text-anchor="middle">Ondoko mukosa</text><text x="266.0" y="159" font-size="16" font-weight="700" fill="#213A52" text-anchor="middle">Ehun tumorala</text><g fill="#2E7D71"><circle cx="52" cy="217" r="9"/><circle cx="86" cy="242" r="9"/><circle cx="126" cy="215" r="9"/><circle cx="140" cy="259" r="9"/><circle cx="66" cy="267" r="9"/></g><g fill="#5C7189"><rect x="208" y="211" width="30" height="9" rx="4"/><rect x="258" y="229" width="30" height="9" rx="4"/><rect x="292" y="207" width="30" height="9" rx="4"/><rect x="222" y="255" width="30" height="9" rx="4"/><rect x="284" y="263" width="30" height="9" rx="4"/></g><text x="16" y="323" font-size="16" font-weight="400" fill="#213A52" text-anchor="start">Ugariagoak tumore
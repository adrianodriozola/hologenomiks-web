<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 564" font-family="'Source Sans 3', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t"><title id="t">Irakurketa laburrak eta luzeak 16S rRNA genean</title><rect width="360" height="564" fill="#F4F2EC"/><defs><marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#213A52"/></marker></defs><rect width="360" height="94" fill="#213A52"/><text x="16" y="35" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="start">Irakurketa luzeko</text><text x="16" y="59" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="start">sekuentziazioa eta</text><text x="16" y="83" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="start">mikrobioma</text><text x="16" y="128" font-size="16" font-weight="700" fill="#213A52" text-anchor="start">16S rRNA genea (≈ 1.500 bp) eta</text><text x="16" y="149" font-size="16" font-weight="700" fill="#213A52" text-anchor="start">haren V1–V9 eskualde aldakorrak</text><rect x="16" y="155" width="328" height="24" rx="4" fill="#E9EDF1" stroke="#213A52"/><rect x="24" y="159" width="20" height="16" fill="#213A52" opacity=".85"/><rect x="60" y="159" width="20" height="16" fill="#213A52" opacity=".85"/><rect x="96" y="159" width="20" height="16" fill="#213A52" opacity=".85"/><rect x="132" y="159" width="20" height="16" fill="#213A52" opacity=".85"/><rect x="168" y="159" width="20" height="16" fill="#213A52" opacity=".85"/><rect x="204" y="159" width="20" height="16" fill="#213A52" opacity=".85"/><rect x="240" y="159" width="20" height="16" fill="#213A52" opacity=".85"/><rect x="276" y="159" width="20" height="16" fill="#213A52" opacity=".85"/><rect x="312" y="159" width="20" height="16" fill="#213A52" opacity=".85"/><text x="16" y="211" font-size="16" font-weight="700" fill="#213A52" text-anchor="start">Irakurketa laburra: eskualde bat</text><text x="16" y="232" font-size="16" font-weight="700" fill="#213A52" text-anchor="start">edo bi, adibidez V3–V4</text><rect x="60" y="238" width="80" height="14" rx="3" fill="#5F6E78"/><text x="16" y="271" font-size="15" font-weight="400" fill="#213A52" text-anchor="start">Ohiko bereizmena: generoa</text><text x="16" y="301" font-size="16" font-weight="700" fill="#213A52" text-anchor="start">Irakurketa luzea: gene osoa,</text><text x="16" y="322" font-size="16" font-weight="700" fill="#213A52" text-anchor="start">adibidez Oxford Nanopore MinION</text><rect x="16" y="328" width="328" height="14" rx="3" fill="#213A52"/><text x="16" y="374" font-size="16" font-weight="400" fill="#213A52" text-anchor="start">Irakurketa bakoitzak testuinguru</text><text x="16" y="395" font-size="16" font-weight="400" fill="#213A52" text-anchor="start">gehiago ematen du. Bereizmen</text><text x="16" y="416" font-size="16" font-weight="400" fill="#213A52" text-anchor="start">taxonomikoa hobea da, eta muntaiak</text><text x="16" y="437" font-size="16" font-weight="400" fill="#213A52" text-anchor="start">jarraituagoak. Dimentsio berriak ere</text><text x="16" y="458" font-size="16" font-weight="400" fill="#213A52" text-anchor="start">irekitzen ditu, hala nola biroma edo</text><text x="16" y="479" font-size="16" font-weight="400" fill="#213A52" text-anchor="start">epigenetika bakterianoa.</text><text x="16" y="504" font-size="15" font-weight="400" fill="#5F6E78" text-anchor="start">Gaur egun ez dago ezaugarri desiragarri</text><text x="16" y="524" font-size="15" font-weight="400" fill="#5F6E78" text-anchor="start">guztiak dituen metodorik.</text><text x="344" y="552" font-size="13" font-weight="400" fill="#5F6E78" text-anchor="end">Eskema propioa, ilustratiboa · Hologenomiks</text></svg>
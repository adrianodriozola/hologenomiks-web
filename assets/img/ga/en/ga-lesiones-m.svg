<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 585" font-family="'Source Sans 3', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t"><title id="t">Intestinal permeability, low-grade inflammation and musculoskeletal injuries</title><rect width="360" height="585" fill="#F4F2EC"/><defs><marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#213A52"/></marker></defs><rect width="360" height="70" fill="#213A52"/><text x="16" y="35" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="start">Gut and musculoskeletal</text><text x="16" y="59" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="start">injuries</text><rect x="16" y="88" width="328" height="42" rx="8" fill="#E9EDF1" stroke="#213A52"/><text x="180.0" y="119" font-size="17" font-weight="700" fill="#213A52" text-anchor="middle">Dysbiosis</text><path d="M180.0 134 V156" stroke="#213A52" stroke-width="3" marker-end="url(#f)"/><rect x="16" y="164" width="328" height="42" rx="8" fill="#E9EDF1" stroke="#213A52"/><text x="180.0" y="195" font-size="17" font-weight="700" fill="#213A52" text-anchor="middle">Increased permeability</text><path d="M180.0 210 V232" stroke="#213A52" stroke-width="3" marker-end="url(#f)"/><rect x="16" y="240" width="328" height="64" rx="8" fill="#E9EDF1" stroke="#213A52"/><text x="180.0" y="271" font-size="17" font-weight="700" fill="#213A52" text-anchor="middle">Endotoxaemia and low-grade</text><text x="180.0" y="293" font-size="17" font-weight="700" fill="#213A52" text-anchor="middle">inflammation</text><path d="M180.0 308 V330" stroke="#213A52" stroke-width="3" marker-end="url(#f)"/><rect x="16" y="338" width="328" height="42" rx="8" fill="#213A52" stroke="#213A52"/><text x="180.0" y="369" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">Slower injury recovery?</text><text x="16" y="416" font-size="16" font-weight="400" fill="#213A52" text-anchor="start">Review: examines the indirect link</text><text x="16" y="437" font-size="16" font-weight="400" fill="#213A52" text-anchor="start">between gut health and local</text><text x="16" y="458" font-size="16" font-weight="400" fill="#213A52" text-anchor="start">inflammation; diet, prebiotics and</text><text x="16" y="479" font-size="16" font-weight="400" fill="#213A52" text-anchor="start">probiotics are discussed as possible</text><text x="16" y="500" font-size="16" font-weight="400" fill="#213A52" text-anchor="start">modulators.</text><text x="16" y="525" font-size="15" font-weight="400" fill="#5F6E78" text-anchor="start">A hypothesis with emerging evidence,</text><text x="16" y="545" font-size="15" font-weight="400" fill="#5F6E78" text-anchor="start">not a proven causal relationship.</text><text x="344" y="573" font-size="13" font-weight="400" fill="#5F6E78" text-anchor="end">Own illustrative diagram · Hologenomiks</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Source Sans 3, Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t"><title id="t">Intestinal permeability, low-grade inflammation and musculoskeletal injuries</title><rect width="640" height="400" fill="#F4F2EC"/><rect width="640" height="54" fill="#213A52"/><text x="24" y="35" fill="#fff" font-size="20" font-weight="700">Gut and musculoskeletal injuries</text><defs><marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#213A52"/></marker></defs><rect x="24" y="110" width="128" height="110" rx="8" fill="#E9EDF1" stroke="#213A52"/><text x="88.0" y="170.0" font-size="14" font-weight="700" fill="#213A52" text-anchor="middle">Dysbiosis</text><path d="M156 165 H176" stroke="#213A52" stroke-width="3" marker-end="url(#f)"/><rect x="180" y="110" width="128" height="110" rx="8" fill="#E9EDF1" stroke="#213A52"/><text x="244.0" y="160.0" font-size="14" font-weight="700" fill="#213A52" text-anchor="middle">Increased</text><text x="244.0" y="180.0" font-size="14" font-weight="700" fill="#213A52" text-anchor="middle">permeability</text><path d="M312 165 H332" stroke="#213A52" stroke-width="3" marker-end="url(#f)"/><rect x="336" y="110" width="128" height="110" rx="8" fill="#E9EDF1" stroke="#213A52"/><text x="400.0" y="150.0" font-size="14" font-weight="700" fill="#213A52" text-anchor="middle">Endotoxaemia and</text><text x="400.0" y="170.0" font-size="14" font-weight="700" fill="#213A52" text-anchor="middle">low-grade</text><text x="400.0" y="190.0" font-size="14" font-weight="700" fill="#213A52" text-anchor="middle">inflammation</text><path d="M468 165 H488" stroke="#213A52" stroke-width="3" marker-end="url(#f)"/><rect x="492" y="110" width="128" height="110" rx="8" fill="#E9EDF1" stroke="#213A52"/><text x="556.0" y="150.0" font-size="14" font-weight="700" fill="#213A52" text-anchor="middle">Slower injury</text><text x="556.0" y="170.0" font-size="14" font-weight="700" fill="#213A52" text-anchor="middle">recovery?</text><text x="556.0" y="190.0" font-size="14" font-weight="700" fill="#213A52" text-anchor="middle"> </text><text x="24" y="270" font-size="13" font-weight="400" fill="#213A52" text-anchor="start">Review: examines the indirect link between gut health and local</text><text x="24" y="290" font-size="13" font-weight="400" fill="#213A52" text-anchor="start">inflammation; diet, prebiotics and probiotics are discussed as possible modulators.</text><text x="24" y="322" font-size="13" font-weight="400" fill="#5F6E78" text-anchor="start">A hypothesis with emerging evidence, not a proven causal relationship.</text><text x="616" y="390" text-anchor="end" fill="#5F6E78" font-size="12">Own illustrative diagram · Hologenomiks</text></svg>
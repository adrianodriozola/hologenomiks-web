<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 594" font-family="'Source Sans 3', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t"><title id="t">Ultra-processed foods, gut barrier and GI complaints in endurance</title><rect width="360" height="594" fill="#F4F2EC"/><defs><marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#213A52"/></marker></defs><rect width="360" height="70" fill="#213A52"/><text x="16" y="35" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="start">Ultra-processed foods and</text><text x="16" y="59" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="start">gut health in athletes</text><rect x="16" y="88" width="328" height="86" rx="8" fill="#E9EDF1" stroke="#213A52"/><text x="180.0" y="119" font-size="17" font-weight="700" fill="#213A52" text-anchor="middle">Supplements and</text><text x="180.0" y="141" font-size="17" font-weight="700" fill="#213A52" text-anchor="middle">ultra-processed products</text><text x="180.0" y="161" font-size="14" font-weight="400" fill="#213A52" text-anchor="middle">additives, sweeteners</text><path d="M180.0 178 V200" stroke="#213A52" stroke-width="3" marker-end="url(#f)"/><rect x="16" y="208" width="328" height="84" rx="8" fill="#FFFFFF" stroke="#213A52"/><text x="180.0" y="232" font-size="15" font-weight="400" fill="#213A52" text-anchor="middle">Gut barrier</text><rect x="38" y="244" width="24" height="36" fill="#213A52"/><rect x="70" y="244" width="24" height="36" fill="#213A52"/><rect x="102" y="244" width="24" height="36" fill="#213A52"/><rect x="134" y="244" width="24" height="36" fill="#213A52"/><rect x="166" y="244" width="24" height="36" fill="#213A52"/><rect x="198" y="244" width="24" height="36" fill="#213A52"/><rect x="230" y="244" width="24" height="36" fill="#213A52"/><rect x="262" y="244" width="24" height="36" fill="#213A52"/><rect x="294" y="244" width="24" height="36" fill="#213A52"/><path d="M180.0 296 V318" stroke="#213A52" stroke-width="3" marker-end="url(#f)"/><rect x="16" y="326" width="328" height="42" rx="8" fill="#213A52" stroke="#213A52"/><text x="180.0" y="357" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">Dysbiosis and permeability</text><text x="16" y="404" font-size="16" font-weight="400" fill="#213A52" text-anchor="start">Narrative review: proposes that some</text><text x="16" y="425" font-size="16" font-weight="400" fill="#213A52" text-anchor="start">GI complaints in endurance events may</text><text x="16" y="446" font-size="16" font-weight="400" fill="#213A52" text-anchor="start">relate to a high intake of</text><text x="16" y="467" font-size="16" font-weight="400" fill="#213A52" text-anchor="start">ultra-processed products, and</text><text x="16" y="488" font-size="16" font-weight="400" fill="#213A52" text-anchor="start">suggests tailoring nutrition to each</text><text x="16" y="509" font-size="16" font-weight="400" fill="#213A52" text-anchor="start">athlete's gut function.</text><text x="16" y="534" font-size="15" font-weight="400" fill="#5F6E78" text-anchor="start">A hypothesis that requires intervention</text><text x="16" y="554" font-size="15" font-weight="400" fill="#5F6E78" text-anchor="start">studies.</text><text x="344" y="582" font-size="13" font-weight="400" fill="#5F6E78" text-anchor="end">Own illustrative diagram · Hologenomiks</text></svg>
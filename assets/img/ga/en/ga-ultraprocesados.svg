<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Source Sans 3, Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t"><title id="t">Ultra-processed foods, gut barrier and GI complaints in endurance</title><rect width="640" height="400" fill="#F4F2EC"/><rect width="640" height="54" fill="#213A52"/><text x="24" y="35" fill="#fff" font-size="20" font-weight="700">Ultra-processed foods and gut health in athletes</text><defs><marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#213A52"/></marker></defs><rect x="24" y="100" width="170" height="90" rx="8" fill="#E9EDF1" stroke="#213A52"/><text x="109.0" y="130.0" font-size="14" font-weight="700" fill="#213A52" text-anchor="middle">Supplements and</text><text x="109.0" y="150.0" font-size="14" font-weight="700" fill="#213A52" text-anchor="middle">ultra-processed</text><text x="109.0" y="170.0" font-size="12" font-weight="400" fill="#213A52" text-anchor="middle">additives, sweeteners</text><path d="M200 145 H246" stroke="#213A52" stroke-width="3" marker-end="url(#f)"/><rect x="256" y="100" width="150" height="90" rx="8" fill="#fff" stroke="#213A52"/><rect x="268" y="132" width="22" height="40" fill="#213A52"/><rect x="296" y="132" width="22" height="40" fill="#213A52"/><rect x="324" y="132" width="22" height="40" fill="#213A52"/><rect x="352" y="132" width="22" height="40" fill="#213A52"/><rect x="380" y="132" width="22" height="40" fill="#213A52"/><text x="331" y="122" font-size="12" font-weight="400" fill="#213A52" text-anchor="middle">Gut barrier</text><path d="M412 145 H458" stroke="#213A52" stroke-width="3" marker-end="url(#f)"/><rect x="468" y="100" width="148" height="90" rx="8" fill="#213A52" stroke="#213A52"/><text x="542.0" y="140.0" font-size="14" font-weight="700" fill="#F4F2EC" text-anchor="middle">Dysbiosis and</text><text x="542.0" y="160.0" font-size="14" font-weight="700" fill="#F4F2EC" text-anchor="middle">permeability</text><text x="24" y="250" font-size="13" font-weight="400" fill="#213A52" text-anchor="start">Narrative review: proposes that some GI complaints in endurance events</text><text x="24" y="270" font-size="13" font-weight="400" fill="#213A52" text-anchor="start">may relate to a high intake of ultra-processed products, and suggests</text><text x="24" y="290" font-size="13" font-weight="400" fill="#213A52" text-anchor="start">tailoring nutrition to each athlete&#39;s gut function.</text><text x="24" y="322" font-size="13" font-weight="400" fill="#5F6E78" text-anchor="start">A hypothesis that requires intervention studies.</text><text x="616" y="390" text-anchor="end" fill="#5F6E78" font-size="12">Own illustrative diagram · Hologenomiks</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Source Sans 3, Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t"><title id="t">Short versus long reads on the 16S rRNA gene</title><rect width="640" height="400" fill="#F4F2EC"/><rect width="640" height="54" fill="#213A52"/><text x="24" y="35" fill="#fff" font-size="20" font-weight="700">Long-read sequencing and the microbiome</text><defs><marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#213A52"/></marker></defs><text x="24" y="92" font-size="15" font-weight="700" fill="#213A52" text-anchor="start">16S rRNA gene (≈ 1,500 bp) with variable regions V1–V9</text><rect x="24" y="104" width="592" height="26" rx="4" fill="#E9EDF1" stroke="#213A52"/><rect x="40" y="108" width="34" height="18" fill="#213A52" opacity=".85"/><rect x="104" y="108" width="34" height="18" fill="#213A52" opacity=".85"/><rect x="168" y="108" width="34" height="18" fill="#213A52" opacity=".85"/><rect x="232" y="108" width="34" height="18" fill="#213A52" opacity=".85"/><rect x="296" y="108" width="34" height="18" fill="#213A52" opacity=".85"/><rect x="360" y="108" width="34" height="18" fill="#213A52" opacity=".85"/><rect x="424" y="108" width="34" height="18" fill="#213A52" opacity=".85"/><rect x="488" y="108" width="34" height="18" fill="#213A52" opacity=".85"/><rect x="552" y="108" width="34" height="18" fill="#213A52" opacity=".85"/><text x="24" y="178" font-size="15" font-weight="700" fill="#213A52" text-anchor="start">Short read (one or two regions, e.g. V3–V4)</text><rect x="104" y="190" width="150" height="16" rx="3" fill="#5F6E78"/><text x="270" y="203" font-size="13" font-weight="400" fill="#213A52" text-anchor="start">Usual resolution: genus</text><text x="24" y="250" font-size="15" font-weight="700" fill="#213A52" text-anchor="start">Long read (full-length gene, e.g. Oxford Nanopore MinION)</text><rect x="24" y="262" width="592" height="16" rx="3" fill="#213A52"/><rect x="24" y="281" width="592" height="4" fill="#F4F2EC"/><text x="24" y="320" font-size="13" font-weight="400" fill="#213A52" text-anchor="start">More context per read: better taxonomic resolution and more contiguous assemblies;</text><text x="24" y="339" font-size="13" font-weight="400" fill="#213A52" text-anchor="start">new dimensions such as the virome or bacterial epigenetics.</text><text x="24" y="358" font-size="13" font-weight="400" fill="#5F6E78" text-anchor="start">No method yet combines all desirable features.</text><text x="616" y="390" text-anchor="end" fill="#5F6E78" font-size="12">Own illustrative diagram · Hologenomiks</text></svg>
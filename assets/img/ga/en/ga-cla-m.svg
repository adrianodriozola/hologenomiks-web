<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 599" font-family="'Source Sans 3', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t"><title id="t">Conjugated linoleic acid production by gut bacteria</title><rect width="360" height="599" fill="#F4F2EC"/><defs><marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#213A52"/></marker></defs><rect width="360" height="70" fill="#213A52"/><text x="16" y="35" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="start">Bacterial CLA and colorectal</text><text x="16" y="59" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="start">cancer</text><rect x="16" y="88" width="328" height="64" rx="8" fill="#E9EDF1" stroke="#213A52"/><text x="180.0" y="119" font-size="17" font-weight="700" fill="#213A52" text-anchor="middle">Linoleic acid</text><text x="180.0" y="139" font-size="14" font-weight="400" fill="#213A52" text-anchor="middle">from the diet</text><path d="M180.0 156 V178" stroke="#213A52" stroke-width="3" marker-end="url(#f)"/><g fill="#2E7D71"><rect x="110" y="186" width="56" height="22" rx="11"/><rect x="190" y="196" width="56" height="22" rx="11"/><rect x="140" y="222" width="56" height="22" rx="11"/><rect x="220" y="230" width="56" height="22" rx="11"/></g><text x="180.0" y="274" font-size="16" font-weight="700" fill="#213A52" text-anchor="middle">Producing bacteria</text><text x="180.0" y="293" font-size="15" font-weight="400" fill="#213A52" text-anchor="middle">e.g. Bifidobacterium, Roseburia</text><path d="M180.0 303 V325" stroke="#213A52" stroke-width="3" marker-end="url(#f)"/><rect x="16" y="333" width="328" height="64" rx="8" fill="#213A52" stroke="#213A52"/><text x="180.0" y="364" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">Endogenous CLA</text><text x="180.0" y="384" font-size="14" font-weight="400" fill="#F4F2EC" text-anchor="middle">in the colon</text><text x="16" y="433" font-size="16" font-weight="400" fill="#213A52" text-anchor="start">Review: CLA produced by gut bacteria</text><text x="16" y="454" font-size="16" font-weight="400" fill="#213A52" text-anchor="start">acts in experimental models on</text><text x="16" y="475" font-size="16" font-weight="400" fill="#213A52" text-anchor="start">inflammation, proliferation and</text><text x="16" y="496" font-size="16" font-weight="400" fill="#213A52" text-anchor="start">apoptosis pathways. Enhancing its</text><text x="16" y="517" font-size="16" font-weight="400" fill="#213A52" text-anchor="start">endogenous production with</text><text x="16" y="538" font-size="16" font-weight="400" fill="#213A52" text-anchor="start">microbiome-based precision nutrition</text><text x="16" y="559" font-size="16" font-weight="400" fill="#213A52" text-anchor="start">is proposed. Not a treatment.</text><text x="344" y="587" font-size="13" font-weight="400" fill="#5F6E78" text-anchor="end">Own illustrative diagram · Hologenomiks</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 692" font-family="'Source Sans 3', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t"><title id="t">Microbiome-based precision nutrition intervention, before and after</title><rect width="360" height="692" fill="#F4F2EC"/><defs><marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#213A52"/></marker></defs><rect width="360" height="70" fill="#213A52"/><text x="16" y="35" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="start">Precision nutrition and T2D</text><text x="16" y="59" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="start">prevention</text><rect x="16" y="88" width="328" height="64" rx="8" fill="#E9EDF1" stroke="#213A52"/><text x="180.0" y="119" font-size="17" font-weight="700" fill="#213A52" text-anchor="middle">Microbiota</text><text x="180.0" y="139" font-size="14" font-weight="400" fill="#213A52" text-anchor="middle">Full-length 16S · MinION</text><path d="M180.0 156 V178" stroke="#213A52" stroke-width="3" marker-end="url(#f)"/><rect x="16" y="186" width="328" height="64" rx="8" fill="#213A52" stroke="#213A52"/><text x="180.0" y="217" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">Food ranking</text><text x="180.0" y="237" font-size="14" font-weight="400" fill="#F4F2EC" text-anchor="middle">Phymofood (European patent)</text><path d="M180.0 254 V276" stroke="#213A52" stroke-width="3" marker-end="url(#f)"/><rect x="16" y="284" width="328" height="64" rx="8" fill="#E9EDF1" stroke="#213A52"/><text x="180.0" y="315" font-size="17" font-weight="700" fill="#213A52" text-anchor="middle">3 months</text><text x="180.0" y="335" font-size="14" font-weight="400" fill="#213A52" text-anchor="middle">n = 13, aged over 62</text><text x="16" y="384" font-size="16" font-weight="700" fill="#213A52" text-anchor="start">Relative abundance of two genera</text><text x="16" y="405" font-size="16" font-weight="700" fill="#213A52" text-anchor="start">of interest (schematic)</text><rect x="16" y="415" width="14" height="14" fill="#5F6E78"/><text x="36" y="427" font-size="15" font-weight="400" fill="#213A52" text-anchor="start">before</text><rect x="146" y="415" width="14" height="14" fill="#2E7D71"/><text x="166" y="427" font-size="15" font-weight="400" fill="#213A52" text-anchor="start">after</text><line x1="16" y1="581" x2="344" y2="581" stroke="#5F6E78"/><rect x="39" y="526" width="52" height="55" fill="#5F6E78"/><rect x="99" y="481" width="52" height="100" fill="#2E7D71"/><text x="95" y="603" font-size="15" font-weight="400" fill="#213A52" text-anchor="middle" font-style="italic">Faecalibacterium</text><rect x="209" y="536" width="52" height="45" fill="#5F6E78"/><rect x="269" y="496" width="52" height="85" fill="#2E7D71"/><text x="265" y="603" font-size="15" font-weight="400" fill="#213A52" text-anchor="middle" font-style="italic">Butyrivibrio</text><text x="16" y="632" font-size="15" font-weight="400" fill="#5F6E78" text-anchor="start">Pilot study without a control group:</text><text x="16" y="652" font-size="15" font-weight="400" fill="#5F6E78" text-anchor="start">changes cannot be generalised.</text><text x="344" y="680" font-size="13" font-weight="400" fill="#5F6E78" text-anchor="end">Own illustrative diagram · Hologenomiks</text></svg>
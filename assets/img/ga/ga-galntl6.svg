<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Source Sans 3, Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t"><title id="t">Polimorfismo GALNTL6 rs558129 y potencia anaeróbica</title><rect width="640" height="400" fill="#F4F2EC"/><rect width="640" height="54" fill="#213A52"/><text x="24" y="35" fill="#fff" font-size="20" font-weight="700">Genética y potencia: GALNTL6 rs558129</text><defs><marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#213A52"/></marker></defs><text x="24" y="90" font-size="13" font-weight="700" fill="#213A52" text-anchor="start">Test de Wingate (85 personas activas, España) y frecuencias alélicas en deportistas (Rusia)</text><line x1="90" y1="310" x2="560" y2="310" stroke="#5F6E78"/><rect x="150" y="190" width="110" height="120" fill="#5F6E78"/><text x="205" y="332" font-size="14" font-weight="400" fill="#213A52" text-anchor="middle">Genotipo CC</text><rect x="370" y="176" width="110" height="134" fill="#213A52"/><text x="425" y="332" font-size="14" font-weight="400" fill="#213A52" text-anchor="middle">Portadores del alelo T</text><text x="425" y="164" font-size="14" font-weight="700" fill="#213A52" text-anchor="middle">potencia ≈ 5–7 % mayor</text><text x="24" y="368" font-size="12" font-weight="400" fill="#5F6E78" text-anchor="start">Efecto pequeño de una sola variante: el rendimiento es poligénico y depende del entrenamiento.</text><text x="616" y="390" text-anchor="end" fill="#5F6E78" font-size="12">Esquema propio, ilustrativo · Hologenomiks</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 519" font-family="'Source Sans 3', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t"><title id="t">Lecturas cortas frente a lecturas largas en el gen 16S rRNA</title><rect width="360" height="519" fill="#F4F2EC"/><defs><marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#213A52"/></marker></defs><rect width="360" height="70" fill="#213A52"/><text x="16" y="35" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="start">Secuenciación de lectura</text><text x="16" y="59" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="start">larga y microbioma</text><text x="16" y="104" font-size="16" font-weight="700" fill="#213A52" text-anchor="start">Gen 16S rRNA (≈ 1 500 pb) con sus</text><text x="16" y="125" font-size="16" font-weight="700" fill="#213A52" text-anchor="start">regiones variables V1–V9</text><rect x="16" y="131" width="328" height="24" rx="4" fill="#E9EDF1" stroke="#213A52"/><rect x="24" y="135" width="20" height="16" fill="#213A52" opacity=".85"/><rect x="60" y="135" width="20" height="16" fill="#213A52" opacity=".85"/><rect x="96" y="135" width="20" height="16" fill="#213A52" opacity=".85"/><rect x="132" y="135" width="20" height="16" fill="#213A52" opacity=".85"/><rect x="168" y="135" width="20" height="16" fill="#213A52" opacity=".85"/><rect x="204" y="135" width="20" height="16" fill="#213A52" opacity=".85"/><rect x="240" y="135" width="20" height="16" fill="#213A52" opacity=".85"/><rect x="276" y="135" width="20" height="16" fill="#213A52" opacity=".85"/><rect x="312" y="135" width="20" height="16" fill="#213A52" opacity=".85"/><text x="16" y="187" font-size="16" font-weight="700" fill="#213A52" text-anchor="start">Lectura corta (una o dos regiones,</text><text x="16" y="208" font-size="16" font-weight="700" fill="#213A52" text-anchor="start">p. ej. V3–V4)</text><rect x="60" y="214" width="80" height="14" rx="3" fill="#5F6E78"/><text x="16" y="247" font-size="15" font-weight="400" fill="#213A52" text-anchor="start">Resolución habitual: género</text><text x="16" y="277" font-size="16" font-weight="700" fill="#213A52" text-anchor="start">Lectura larga (gen completo, p.</text><text x="16" y="298" font-size="16" font-weight="700" fill="#213A52" text-anchor="start">ej. Oxford Nanopore MinION)</text><rect x="16" y="304" width="328" height="14" rx="3" fill="#213A52"/><text x="16" y="350" font-size="16" font-weight="400" fill="#213A52" text-anchor="start">Más contexto por lectura: mejor</text><text x="16" y="371" font-size="16" font-weight="400" fill="#213A52" text-anchor="start">resolución taxonómica y ensamblajes</text><text x="16" y="392" font-size="16" font-weight="400" fill="#213A52" text-anchor="start">más continuos; nuevas dimensiones</text><text x="16" y="413" font-size="16" font-weight="400" fill="#213A52" text-anchor="start">como el viroma o la epigenética</text><text x="16" y="434" font-size="16" font-weight="400" fill="#213A52" text-anchor="start">bacteriana.</text><text x="16" y="459" font-size="15" font-weight="400" fill="#5F6E78" text-anchor="start">Ningún método reúne hoy todas las</text><text x="16" y="479" font-size="15" font-weight="400" fill="#5F6E78" text-anchor="start">características deseables.</text><text x="344" y="507" font-size="13" font-weight="400" fill="#5F6E78" text-anchor="end">Esquema propio, ilustrativo · Hologenomiks</text></svg>
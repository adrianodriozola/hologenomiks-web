<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Source Sans 3, Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t"><title id="t">Intervención de nutrición de precisión basada en microbioma, antes y después</title><rect width="640" height="400" fill="#F4F2EC"/><rect width="640" height="54" fill="#213A52"/><text x="24" y="35" fill="#fff" font-size="20" font-weight="700">Nutrición de precisión y prevención de la DT2</text><defs><marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#213A52"/></marker></defs><rect x="24" y="78" width="150" height="72" rx="8" fill="#E9EDF1" stroke="#213A52"/><text x="99.0" y="109.0" font-size="14" font-weight="700" fill="#213A52" text-anchor="middle">Microbiota</text><text x="99.0" y="129.0" font-size="12" font-weight="400" fill="#213A52" text-anchor="middle">16S completo · MinION</text><path d="M178 114 H232" stroke="#213A52" stroke-width="3" marker-end="url(#f)"/><rect x="236" y="78" width="168" height="72" rx="8" fill="#213A52" stroke="#213A52"/><text x="320.0" y="109.0" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">Ranking de alimentos</text><text x="320.0" y="129.0" font-size="12" font-weight="400" fill="#F4F2EC" text-anchor="middle">Phymofood (patente europea)</text><path d="M408 114 H452" stroke="#213A52" stroke-width="3" marker-end="url(#f)"/><rect x="456" y="78" width="170" height="72" rx="8" fill="#E9EDF1" stroke="#213A52"/><text x="541.0" y="109.0" font-size="14" font-weight="700" fill="#213A52" text-anchor="middle">3 meses</text><text x="541.0" y="129.0" font-size="12" font-weight="400" fill="#213A52" text-anchor="middle">n = 13, mayores de 62 años</text><text x="80" y="200" font-size="14" font-weight="700" fill="#213A52" text-anchor="start">Abundancia relativa de dos géneros de interés (esquema)</text><line x1="80" y1="330" x2="560" y2="330" stroke="#5F6E78"/><rect x="130" y="280" width="60" hei